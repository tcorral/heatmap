[package]
name = "heatmap-integration"
version = "0.1.0"
edition = "2021"
publish = false

[dev-dependencies]
axum = "0.8"
heatmap-backend = { path = "../../backend" }
heatmap-core = { path = "../../core/heatmap-core" }
http-body-util = "0.1"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
