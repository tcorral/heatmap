# Optional connected Android E2E — emulator + NDK + adb reverse (Step 43).
name: E2E Android (emulator)

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "poc/android/**"
      - "sdk/android/**"
      - "test/e2e/scripts/run-android-e2e.sh"
      - ".github/workflows/e2e-android-emulator.yml"

concurrency:
  group: e2e-android-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  connected-android-e2e:
    name: connectedDebugAndroidTest
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install NDK (heatmap-ffi Android targets)
        run: sdkmanager --install "ndk;26.1.10909125"
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125

      - name: Run connected Android E2E on emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash test/e2e/scripts/run-android-e2e.sh
